providers:
  - name: openrouter
    api_url: https://openrouter.ai/api/v1
    api_key: $OPENROUTER_API_KEY
    models:
      - id: anthropic/claude-sonnet-4-6
        alias: claude-sonnet
        capabilities: [code, reasoning, tool-use]
      - id: anthropic/claude-haiku-4-5
        alias: claude-haiku
        capabilities: [code, fast-edits, tool-use]
      - id: anthropic/claude-opus-4-7
        alias: claude-opus
        capabilities: [code, reasoning, architecture, tool-use]

  - name: ollama
    api_url: http://localhost:11434/v1
    api_key: ollama
    models:
      - id: qwen3-coder
        alias: qwen-coder
        capabilities: [code, fast-edits]
      - id: deepseek-r1
        alias: deepseek
        capabilities: [reasoning, architecture]

model_preferences:
  default: claude-haiku
  fast: claude-haiku
  architect: claude-opus
